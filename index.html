<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>KinoMezafilms — каталог фильмов</title>
<style>
:root {
  --bg:#090914;
  --panel:#151526;
  --panel2:#202039;
  --text:#f5f5ff;
  --muted:#a5a5bd;
  --purple:#a855f7;
  --pink:#ec4899;
  --border:#ffffff15;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:radial-gradient(circle at 50% -10%,#38205c 0%,var(--bg) 42%);
  color:var(--text);
  font-family:Arial,sans-serif;
}
button,input { font:inherit; }
button { cursor:pointer; }
header {
  position:sticky;
  top:0;
  z-index:10;
  padding:15px 5%;
  background:#090914eF;
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.nav {
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.logo {
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px;
}
.logo span { color:var(--pink); }
nav { display:flex; gap:8px; flex-wrap:wrap; }
.btn {
  border:1px solid var(--border);
  background:var(--panel2);
  color:white;
  border-radius:12px;
  padding:10px 15px;
  transition:.2s;
}
.btn:hover { border-color:var(--purple); transform:translateY(-1px); }
.btn.primary {
  background:linear-gradient(110deg,var(--purple),var(--pink));
  border:0;
  font-weight:bold;
}
main {
  max-width:1250px;
  margin:auto;
  padding:25px 5% 60px;
}
.hero {
  min-height:290px;
  padding:35px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  border:1px solid #a855f744;
  border-radius:25px;
  background:
    linear-gradient(90deg,#0c0b19 5%,#17102ad9 55%,#24103a99),
    radial-gradient(circle at 80% 30%,#a855f766,transparent 50%);
  box-shadow:0 15px 55px #0008;
}
.hero h1 { font-size:clamp(32px,6vw,58px); margin:0 0 12px; }
.hero h1 span { color:#d879ff; }
.hero p { color:var(--muted); max-width:550px; line-height:1.6; }
.search {
  display:flex;
  gap:10px;
  margin-top:18px;
  max-width:650px;
}
.search input {
  min-width:0;
  flex:1;
  padding:14px 16px;
  color:white;
  background:#111120;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
}
.search input:focus { border-color:var(--purple); }
.section-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:35px 0 15px;
}
.section-head h2 { margin:0; font-size:24px; }
.filters {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 12px;
}
.filter {
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:9px 14px;
  border-radius:30px;
}
.filter.active {
  color:white;
  background:linear-gradient(110deg,#8538c9,#bd368b);
  border-color:transparent;
}
.movies {
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:18px;
}
.movie {
  overflow:hidden;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  cursor:pointer;
  transition:.25s;
}
.movie:hover {
  transform:translateY(-5px);
  border-color:#a855f7aa;
  box-shadow:0 12px 30px #0008;
}
.poster {
  height:245px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:15px;
  background:linear-gradient(145deg,#38205c,#111122 65%,#631e55);
  overflow:hidden;
}
.poster img {
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
  inset:0;
}
.poster-title {
  font-size:21px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
  z-index:1;
}
.movie-info { padding:13px; }
.movie-info h3 { margin:0 0 7px; font-size:16px; }
.meta { color:var(--muted); font-size:12px; }
.movie-bottom {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}
.rating { color:#ffd166; font-weight:bold; font-size:13px; }
.heart {
  border:0;
  background:transparent;
  color:#aaa;
  font-size:23px;
  padding:0 3px;
}
.heart.active { color:#ff4f91; }
.empty {
  grid-column:1/-1;
  text-align:center;
  color:var(--muted);
  padding:35px;
  background:var(--panel);
  border-radius:15px;
}
footer {
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
  border-top:1px solid var(--border);
}
.modal {
  position:fixed;
  inset:0;
  z-index:30;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal.show { display:flex; }
.modal-box {
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#151526;
  border:1px solid #a855f755;
  border-radius:20px;
  padding:22px;
  box-shadow:0 20px 70px #000;
}
.modal-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.close {
  border:0;
  color:white;
  background:#ffffff15;
  border-radius:10px;
  padding:9px 13px;
}
.modal-box p { color:var(--muted); line-height:1.65; }
.modal-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
.profile-card {
  background:var(--panel2);
  padding:16px;
  border-radius:14px;
  margin-top:15px;
}
.profile-card input {
  width:100%;
  margin:10px 0;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#101020;
  color:white;
}
@media(max-width:900px) {
  .movies { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media(max-width:600px) {
  header { padding:13px 4%; }
  .nav { align-items:flex-start; flex-direction:column; }
  .logo { font-size:21px; }
  main { padding:18px 4% 40px; }
  .hero { padding:24px 18px; min-height:260px; }
  .movies { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .poster { height:205px; }
  .movie-info { padding:10px; }
  .movie-info h3 { font-size:14px; }
  .section-head h2 { font-size:21px; }
  .search { flex-direction:column; }
  .search button { width:100%; }
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">Kino<span>Meza</span>films</div>
    <nav>
      <button class="btn" onclick="showAll()">Главная</button>
      <button class="btn" onclick="showFavorites()">♥️ Избранное</button>
      <button class="btn" onclick="openProfile()">Профиль</button>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Твой мир <span>кино</span></h1>
    <p>Открывай интересные фильмы, выбирай настроение и находи историю для своего вечера.</p>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Название фильма..." oninput="renderMovies()">
      <button class="btn primary" onclick="randomMovie()">Случайный фильм</button>
    </div>
  </section>

  <div class="section-head">
    <h2 id="catalogTitle">Популярные фильмы</h2>
    <span class="meta" id="movieCount"></span>
  </div>

  <div class="filters" id="filters">
    <button class="filter active" onclick="setGenre('Все',this)">Все</button>
    <button class="filter" onclick="setGenre('Фантастика',this)">Фантастика</button>
    <button class="filter" onclick="setGenre('Боевик',this)">Боевик</button>
    <button class="filter" onclick="setGenre('Драма',this)">Драма</button>
    <button class="filter" onclick="setGenre('Триллер',this)">Триллер</button>
    <button class="filter" onclick="setGenre('Комедия',this)">Комедия</button>
    <button class="filter" onclick="setGenre('Детектив',this)">Детектив</button>
  </div>

  <section class="movies" id="movies"></section>
</main>

<footer>
  <div class="logo">Kino<span>Meza</span>films</div>
  <p>Твоя территория кино © 2026</p>
  <p>Каталог для ознакомления. Права на фильмы принадлежат их владельцам.</p>
</footer>

<div class="modal" id="modal" onclick="outsideClose(event)">
  <div class="modal-box">
    <div class="modal-top">
      <h2 id="modalTitle">Фильм</h2>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const movies = [
  {
    id:1,title:"Интерстеллар",year:2014,genre:"Фантастика",
    rating:"8.6",duration:"169 мин",
    description:"Команда исследователей отправляется за пределы нашей галактики, чтобы найти человечеству новый дом. История о времени, любви и выживании."
  },
  {
    id:2,title:"Начало",year:2010,genre:"Фантастика",
    rating:"8.8",duration:"148 мин",
    description:"Профессионал проникает в сны людей и похищает секреты. Но однажды ему поручают внедрить мысль в чужое сознание."
  },
  {
    id:3,title:"Побег из Шоушенка",year:1994,genre:"Драма",
    rating:"9.1",duration:"142 мин",
    description:"История банкира, который оказывается в тюрьме за преступление, которого не совершал, и не теряет надежды на свободу."
  },
  {
    id:4,title:"Тёмный рыцарь",year:2008,genre:"Боевик",
    rating:"9.0",duration:"152 мин",
    description:"Бэтмен вступает в противостояние с Джокером, который превращает Готэм в город хаоса."
  },
  {
    id:5,title:"Достать ножи",year:2019,genre:"Детектив",
    rating:"7.9",duration:"130 мин",
    description:"Знаменитый писатель найден мёртвым. Детектив расследует дело, в котором каждый член семьи что-то скрывает."
  },
  {
    id:6,title:"Марсианин",year:2015,genre:"Фантастика",
    rating:"8.0",duration:"144 мин",
    description:"Астронавт остаётся один на Марсе и пытается выжить, пока на Земле ищут способ вернуть его домой."
  },
  {
    id:7,title:"Зелёная книга",year:2018,genre:"Драма",
    rating:"8.2",duration:"130 мин",
    description:"Музыкант и его водитель отправляются в путешествие по югу США. Дорога меняет обоих."
  },
  {
    id:8,title:"Грань будущего",year:2014,genre:"Боевик",
    rating:"7.9",duration:"113 мин",
    description:"Военный снова и снова переживает один и тот же день, пытаясь изменить ход войны с инопланетными захватчиками."
  },
  {
    id:9,title:"Джентльмены",year:2019,genre:"Боевик",
    rating:"7.8",duration:"113 мин",
    description:"Американский предприниматель пытается продать свою криминальную империю в Лондоне, но сделка идёт не по плану."
  },
  {
    id:10,title:"Остров проклятых",year:2010,genre:"Триллер",
    rating:"8.2",duration:"138 мин",
    description:"Два федеральных маршала приезжают в психиатрическую лечебницу на острове, чтобы расследовать исчезновение пациентки."
  },
  {
    id:11,title:"Зелёный слоник",year:1999,genre:"Триллер",
    rating:"5.4",duration:"90 мин",
    description:"Два военнослужащих оказываются в замкнутом пространстве гауптвахты. Необычная и мрачная история."
  },
  {
    id:12,title:"Матрица",year:1999,genre:"Фантастика",
    rating:"8.7",duration:"136 мин",
    description:"Хакер узнаёт, что привычный мир — иллюзия, созданная машинами."
  },
  {
    id:13,title:"Один дома",year:1990,genre:"Комедия",
    rating:"7.7",duration:"103 мин",
    description:"Мальчик случайно остаётся один дома на Рождество и вынужден защищать свой дом от двух грабителей."
  },
  {
    id:14,title:"Семь",year:1995,genre:"Триллер",
    rating:"8.6",duration:"127 мин",
    description:"Два детектива расследуют серию жестоких убийств, связанных с семью смертными грехами."
  },
  {
    id:15,title:"День сурка",year:1993,genre:"Комедия",
    rating:"8.0",duration:"101 мин",
    description:"Телеведущий оказывается во временной петле и снова проживает один и тот же день."
  }
];

let currentGenre = "Все";
let favorites = JSON.parse(localStorage.getItem("kmf_favorites") || "[]");
let favoritesOnly = false;

function saveFavorites() {
  localStorage.setItem("kmf_favorites",JSON.stringify(favorites));
}

function renderMovies() {
  const query = document.getElementById("searchInput").value.toLowerCase().trim();
  let list = movies.filter(movie => {
    const matchesGenre = currentGenre === "Все" || movie.genre === currentGenre;
    const matchesSearch = movie.title.toLowerCase().includes(query);
    const matchesFavorites = !favoritesOnly || favorites.includes(movie.id);
    return matchesGenre && matchesSearch && matchesFavorites;
  });

  document.getElementById("movieCount").textContent = list.length + " фильмов";
  const container = document.getElementById("movies");

  if (!list.length) {
    container.innerHTML = '<div class="empty">Фильмы не найдены. Попробуй другой запрос.</div>';
    return;
  }

  container.innerHTML = list.map(movie => `
    <article class="movie" onclick="openMovie(${movie.id})">
      <div class="poster">
      <div class="poster-title">${movie.title}</div>
      </div>
      <div class="movie-info">
        <h3>${movie.title}</h3>
        <div class="meta">${movie.year} · ${movie.genre}</div>
        <div class="movie-bottom">
          <span class="rating">★ ${movie.rating}</span>
          <button class="heart ${favorites.includes(movie.id) ? "active" : ""}"
            onclick="toggleFavorite(event,${movie.id})"
            aria-label="Добавить в избранное">♥️</button>
        </div>
      </div>
    </article>
  `).join("");
}

function setGenre(genre,button) {
  currentGenre = genre;
  favoritesOnly = false;
  document.getElementById("catalogTitle").textContent = "Популярные фильмы";
  document.querySelectorAll(".filter").forEach(el => el.classList.remove("active"));
  button.classList.add("active");
  renderMovies();
}

function toggleFavorite(event,id) {
  event.stopPropagation();
  if (favorites.includes(id)) {
    favorites = favorites.filter(item => item !== id);
  } else {
    favorites.push(id);
  }
  saveFavorites();
  renderMovies();
}

function showFavorites() {
  favoritesOnly = true;
  currentGenre = "Все";
  document.getElementById("catalogTitle").textContent = "Избранное";
  document.querySelectorAll(".filter").forEach(el => el.classList.remove("active"));
  document.querySelector(".filter").classList.add("active");
  renderMovies();
}

function showAll() {
  favoritesOnly = false;
  currentGenre = "Все";
  document.getElementById("searchInput").value = "";
  document.getElementById("catalogTitle").textContent = "Популярные фильмы";
  document.querySelectorAll(".filter").forEach(el => el.classList.remove("active"));
  document.querySelector(".filter").classList.add("active");
  renderMovies();
}

function openMovie(id) {
  const movie = movies.find(item => item.id === id);
  if (!movie) return;

  document.getElementById("modalTitle").textContent = movie.title;
  document.getElementById("modalContent").innerHTML = `
    <div class="meta">${movie.year} · ${movie.genre} · ${movie.duration}</div>
    <h3 class="rating">★ ${movie.rating}</h3>
    <p>${movie.description}</p>
    <div class="modal-actions">
      <button class="btn primary" onclick="searchTrailer('${movie.title.replace(/'/g,"")}')">
        Найти трейлер
      </button>
      <button class="btn" onclick="toggleModalFavorite(${movie.id})">
        ${favorites.includes(movie.id) ? "♥️ Убрать из избранного" : "♡ В избранное"}
      </button>
    </div>
  `;
  document.getElementById("modal").classList.add("show");
}

function toggleModalFavorite(id) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(item => item !== id);
  } else {
    favorites.push(id);
  }
  saveFavorites();
  openMovie(id);
  renderMovies();
}

function searchTrailer(title) {
  window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(title + " трейлер"),"_blank");
}

function randomMovie() {
  const list = movies.filter(movie =>
    currentGenre === "Все" || movie.genre === currentGenre
  );
  if (!list.length) return;
  const movie = list[Math.floor(Math.random()*list.length)];
  openMovie(movie.id);
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

function outsideClose(event) {
  if (event.target.id === "modal") closeModal();
}

function openProfile() {
  const savedName = localStorage.getItem("kmf_username") || "";
  document.getElementById("modalTitle").textContent = "Мой профиль";
  document.getElementById("modalContent").innerHTML = `
    <div class="profile-card">
      <h3>Добро пожаловать в KinoMezafilms!</h3>
      <p>Укажи имя, чтобы оно сохранялось в этом браузере.</p>
      <input id="profileName" placeholder="Твоё имя" value="${escapeHTML(savedName)}">
      <button class="btn primary" onclick="saveProfile()">Сохранить профиль</button>
      <p id="profileMessage"></p>
    </div>
    <div class="profile-card">
      <p>Фильмов в избранном: ${favorites.length}</p>
      <p class="meta">Профиль хранится только на этом устройстве.</p>
    </div>
  `;
  document.
    getElementById("modal").classList.add("show");
}

function saveProfile() {
  const name = document.getElementById("profileName").value.trim();
  if (!name) {
    document.getElementById("profileMessage").textContent = "Введи имя.";
    return;
  }
  localStorage.setItem("kmf_username",name);
  document.getElementById("profileMessage").textContent = "Профиль сохранён!";
}

function escapeHTML(value) {
  return value.replace(/[&<>"']/g,char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[char]));
}

renderMovies();
</script>
</body>
</html>
