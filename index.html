
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090914">
<title>KinoMezafilms — мир кино</title>
<style>
:root {
  --bg:#090914;
  --panel:#151527;
  --panel2:#202039;
  --text:#f5f5ff;
  --muted:#aaaac2;
  --accent:#a855f7;
  --accent2:#ec4899;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:radial-gradient(ellipse at top,#211039 0,#090914 55%);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
header {
  padding:22px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  border-bottom:1px solid #ffffff15;
  background:#090914d9;
  position:sticky;
  top:0;
  z-index:10;
  backdrop-filter:blur(15px);
}
.logo {
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
}
.logo span {color:#c084fc}
nav {display:flex;gap:9px;flex-wrap:wrap}
button,select,input {
  font:inherit;
}
button {
  cursor:pointer;
  border:1px solid #ffffff18;
  color:white;
  background:var(--panel2);
  padding:10px 15px;
  border-radius:10px;
  transition:.2s;
}
button:hover {
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  transform:translateY(-1px);
}
button.active {
  background:linear-gradient(120deg,var(--accent),var(--accent2));
}
main {
  max-width:1250px;
  margin:auto;
  padding:25px 18px 60px;
}
.hero {
  padding:35px 25px;
  border:1px solid #ffffff17;
  border-radius:20px;
  background:linear-gradient(120deg,#35135b,#17172e 65%,#39153d);
  margin-bottom:25px;
}
.hero h1 {font-size:clamp(27px,5vw,45px);margin:0 0 12px}
.hero p {color:#ddd;line-height:1.5}
.tools {
  display:grid;
  grid-template-columns:1fr 190px;
  gap:10px;
  margin-bottom:20px;
}
input,select {
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #ffffff20;
  background:var(--panel);
  color:white;
  outline:none;
}
input:focus,select:focus {border-color:var(--accent)}
.filters {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:14px;
}
.filters button {white-space:nowrap}
.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:22px 0 15px;
}
.section-title h2 {margin:0;font-size:22px}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:17px;
}
.movie {
  min-width:0;
  overflow:hidden;
  border-radius:14px;
  background:var(--panel);
  border:1px solid #ffffff12;
  transition:.2s;
}
.movie:hover {
  transform:translateY(-5px);
  border-color:#a855f788;
}
.poster {
  width:100%;
  aspect-ratio:2/3;
  background:linear-gradient(145deg,#32134d,#111827);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:12px;
  color:#d8b4fe;
  font-weight:bold;
  overflow:hidden;
}
.poster img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.movie-info {padding:11px}
.movie-info h3 {
  margin:0 0 7px;
  font-size:15px;
  line-height:1.3;
}
.meta {color:var(--muted);font-size:12px}
.rating {color:#facc15;margin-top:7px;font-size:13px}
.movie-actions {
  display:flex;
  gap:6px;
  margin-top:10px;
}
.movie-actions button {
  flex:1;
  padding:8px 4px;
  font-size:12px;
}
.empty {
  padding:40px 15px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
}
footer {
  border-top:1px solid #ffffff18;
  padding:25px;
  text-align:center;
  color:var(--muted);
}
.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  background:#000c;
  padding:18px;
  overflow-y:auto;
  align-items:center;
  justify-content:center;
}
.modal.show {display:flex}
.modal-content {
  width:min(600px,100%);
  background:#171729;
  border:1px solid #ffffff22;
  border-radius:18px;
  padding:22px;
  position:relative;
}
.modal-content h2 {margin-top:0}
.modal-content p {line-height:1.6;color:#ddd}
.close {
  position:absolute;
  top:12px;
  right:12px;
}
.modal-poster {
  width:125px;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:10px;
  float:left;
  margin:0 15px 10px 0;
}
.modal-buttons {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}
#toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#28203c;
  border:1px solid #a855f7;
  padding:12px 18px;
  border-radius:12px;
  display:none;
  z-index:50;
}
@media(max-width:600px) {
  header {position:relative}
  .tools {grid-template-columns:1fr}
  .grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .hero {padding:25px 18px}
  nav button {padding:9px 11px;font-size:12px}
}
</style>
</head>

<header>
  <div class="logo">KINO<span>MEZAFILMS</span></div>
  <nav>
    <button onclick="showAll()">Главная</button>
    <button onclick="showFavorites()">Избранное ♥</button>

<main>

    <button onclick="randomMovie()">🎲 Случайный фильм</button>
    <button onclick="movieOfDay()">✨ Фильм дня</button>
  </section>

  <div class="tools">
    <input id="search" placeholder="🔎 Найти фильм..." oninput="renderMovies()">
    <select id="sort" onchange="renderMovies()">
      <option value="default">Сначала популярные</option>
      <option value="rating">По рейтингу</option>
      <option value="year">Сначала новые</option>
      <option value="old">Сначала старые</option>
    </select>
  </div>

  <div class="filters" id="filters"></div>

  <div class="section-title">
    <h2 id="heading">Популярные фильмы</h2>
    <span id="count" class="meta"></span>
  </div>

  <section class="grid" id="movies"></section>
</main>

<footer>
  KinoMezafilms © 2026 · Твоя территория кино
</footer>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>
<div id="toast"></div>

["Одержимость","Whiplash",2014,"Драма",8.5,"Молодой барабанщик стремится стать выдающимся музыкантом."],
["Социальная сеть","The Social Network",2010,"Драма",7.8,"История создания крупной социальной сети."],
["Гран Торино","Gran Torino",2008,"Драма",8.1,"Ветеран неожиданно сближается с соседями."],
["Марсианин","The Martian",2015,"Фантастика",8.0,"Астронавт пытается выжить в одиночестве на Марсе."]
];

const genres = ["Все","Боевик","Комедия","Драма","Фантастика","Триллер","Ужасы","Приключения","Фэнтези","Мультфильм","Криминал","Детектив","Мелодрама"];
let currentGenre = "Все";
let currentMode = "all";
let favorites = load("kmf_favorites",[]);
let later = load("kmf_later",[]);
let profileName = load("kmf_name","Гость");
let posterCache = load("kmf_posters",{});
let posterLoading = new Set();

function load(key,fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch(e) { return fallback; }
}
function save(key,value) {
  try { localStorage.setItem(key,JSON.stringify(value)); }
  catch(e) { console.log("Не удалось сохранить",key); }
}
function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(()=>el.style.display="none",2200);
}
function makeId(title) { return title; }

function renderFilters() {
  document.getElementById("filters").innerHTML = genres.map(g =>
    `<button class="${currentGenre===g?'active':''}" onclick="setGenre('${g}')">${g}</button>`
  ).join("");
}
function setGenre(g) {
  currentGenre=g;
  currentMode="all";
  renderMovies();
}
function showAll() {
  currentMode="all";
  currentGenre="Все";
  renderMovies();
}
function showFavorites() {
  currentMode="favorites";
  currentGenre="Все";
  document.getElementById("heading").textContent="Избранное";
  renderMovies();
}
function showLater() {
  currentMode="later";
  currentGenre="Все";
  document.getElementById("heading").textContent="Посмотреть позже";
  renderMovies();
}
function renderMovies() {
  renderFilters();
  let list = films.map((f,i)=>({f,i}));
  const search = document.getElementById("search").value.trim().toLowerCase();
  if(currentMode==="favorites") list=list.filter(x=>favorites.includes(x.i));
  if(currentMode==="later") list=list.filter(x=>later.includes(x.i));
  if(currentGenre!=="Все") list=list.filter(x=>x.f[3]===currentGenre);
  if(search) list=list.filter(x=>x.f.join(" ").toLowerCase().includes(search));

  const sort=document.getElementById("sort").value;
  if(sort==="rating") list.sort((a,b)=>b.f[4]-a.f[4]);
  if(sort==="year") list.sort((a,b)=>b.f[2]-a.f[2]);
  if(sort==="old") list.sort((a,b)=>a.f[2]-b.f[2]);

  document.getElementById("heading").textContent =
    currentMode==="favorites"?"Избранное":
    currentMode==="later"?"Посмотреть позже":
    currentGenre==="Все"?"Популярные фильмы":currentGenre;

  document.getElementById("count").textContent="Фильмов: "+list.length;
  const root=document.getElementById("movies");

  if(!list.length) {
    root.innerHTML='<div class="empty">Здесь пока пусто. Выбери фильм и добавь его в свою коллекцию.</div>';
    return;
  }

  root.innerHTML=list.map(({f,i})=>`
    <article class="movie">
      <div class="poster" id="poster-${i}">${escapeHTML(f[0])}</div>
      <div class="movie-info">
        <h3>${escapeHTML(f[0])}</h3>
        <div class="meta">${f[2]} · ${escapeHTML(f[3])}</div>
        <div class="rating">★ ${f[4].toFixed(1)}</div>
        <div class="movie-actions">
          <button onclick="openMovie(${i})">Подробнее</button>
          <button onclick="toggleFavorite(${i})">${favorites.includes(i)?"♥":"♡"}</button>
          <button onclick="toggleLater(${i})">＋</button>
        </div>
      </div>
    </article>`).join("");

  list.forEach(({i})=>loadPoster(i));
}
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function putPoster(i,url) {
  const holder=document.getElementById("poster-"+i);
  if(!holder) return;
  const img=document.createElement("img");
  img.alt=films[i][0];
  img.loading="lazy";
  img.src=url;
  img.onerror=()=>{
    img.remove();
    holder.textContent=films[i][0];
  };
  holder.replaceChildren(img);
}
async function loadPoster(i) {
  const holder=document.getElementById("poster-"+i);
  if(!holder || posterLoading.has(i)) return;
  if(posterCache[i]) {
    putPoster(i,posterCache[i]);
    return;
  }
  posterLoading.add(i);
  try {
    const query=encodeURIComponent(films[i][1]+" film");
    const url="https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+query+
      "&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=600&format=json&origin=*";
    const response=await fetch(url);
    if(!response.ok) throw new Error("Image request failed");
    const data=await response.json();
    const pages=Object.values(data.query?.pages||{});
    const found=pages.find(p=>p.thumbnail?.source);
    if(found) {
      posterCache[i]=found.thumbnail.source;
      save("kmf_posters",posterCache);
      putPoster(i,posterCache[i]);
    }
  } catch(error) {
    console.log("Изображение недоступно:",films[i][0]);
  } finally {
    posterLoading.delete(i);
  }
}
function toggleFavorite(i) {
  favorites=favorites.includes(i)?favorites.filter(x=>x!==i):[...favorites,i];
  save("kmf_favorites",favorites);
  toast(favorites.includes(i)?"Добавлено в избранное":"Удалено из избранного");
  renderMovies();
}
function toggleLater(i) {
  later=later.includes(i)?later.filter(x=>x!==i):[...later,i];
  save("kmf_later",later);
  toast(later.includes(i)?"Добавлено в список":"Удалено из списка");
  renderMovies();
}
function openMovie(i) {
  const f=films[i];
  const poster=posterCache[i];
  document.getElementById("modalContent").innerHTML=`
    <button class="close" onclick="closeModal()">✕</button>
    ${poster?`<img class="modal-poster" src="${poster}" alt="">`:""}
    <h2>${escapeHTML(f[0])}</h2>
    <div class="meta">${f[2]} · ${escapeHTML(f[3])} · ★ ${f[4]}</div>
    <p>${escapeHTML(f[5])}</p>
    <div class="modal-buttons">
      <button onclick="toggleFavorite(${i});openMovie(${i})">${favorites.includes(i)?"♥ В избранном":"♡ В избранное"}</button>
      <button onclick="toggleLater(${i});openMovie(${i})">${later.includes(i)?"Убрать из списка":"＋ Посмотреть позже"}</button>
      <button onclick="trailer(${i})">▶ Найти трейлер</button>
    </div>`;
  document.getElementById("modal").classList.add("show");
}
function closeModal() {
  document.getElementById("modal").classList.remove("show");
}
function trailer(i) {
  const q=encodeURIComponent(films[i][0]+" trailer");
  window.open("https://www.youtube.com/results?search_query="+q,"_blank");
}
function randomMovie() {
  openMovie(Math.floor(Math.random()*films.length));
}
function movieOfDay() {
  const day=Math.floor(Date.now()/86400000);
  openMovie(day%films.length);
}
function profile() {
  const name=prompt("Как тебя называть?",profileName);
  if(name===null) return;
  profileName=name.trim()||"Гость";
  save("kmf_name",profileName);
  toast("Привет, "+profileName+"!");
}
renderMovies();
</script>
</body>
</html>
