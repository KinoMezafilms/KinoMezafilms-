<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090914">
<title>KinoMezafilms — мир кино</title>
<style>
:root{color-scheme:dark;--bg:#090914;--panel:#17172b;--panel2:#22223b;--text:#f5f3ff;--muted:#aaa5c0;--accent:#a855f7;--pink:#ec4899}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#292044 0,#090914 48%);color:var(--text);font:16px Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#090914ed;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff18}
.head,main,footer{max-width:1200px;margin:auto;padding:15px 18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:900;background:linear-gradient(90deg,#c084fc,#f472b6);color:transparent;background-clip:text}
nav{display:flex;gap:8px;flex-wrap:wrap}
.btn,.filter{border:1px solid #ffffff20;background:var(--panel2);color:white;border-radius:11px;padding:10px 13px}
.btn:hover,.filter:hover{border-color:var(--accent)}.primary{background:linear-gradient(100deg,#9333ea,#db2777);border:0}
.hero{padding:32px;border:1px solid #ffffff20;border-radius:22px;background:linear-gradient(110deg,#26183e,#401c4a);margin:12px 0 28px}
.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 10px}.hero p{color:#e1d5f3;line-height:1.5;max-width:650px}
.controls{display:grid;grid-template-columns:1fr 190px;gap:10px;margin:16px 0}
.field{width:100%;padding:12px 13px;border-radius:11px;background:var(--panel);border:1px solid #ffffff25;color:white}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}.filter{border-radius:30px;padding:8px 12px}.filter.active{background:#6b21a8;border-color:#c084fc}
.catalog{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.movie{overflow:hidden;background:var(--panel);border:1px solid #ffffff18;border-radius:15px;cursor:pointer;min-width:0}
.movie:hover{transform:translateY(-3px);border-color:var(--accent)}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:linear-gradient(140deg,#34204d,#121222)}
.poster-fallback{aspect-ratio:2/3;display:grid;place-items:center;text-align:center;padding:14px;background:linear-gradient(140deg,#34204d,#121222);color:#e9d5ff;font-weight:bold}
.info{padding:10px}.name{font-weight:bold;line-height:1.35}.meta{font-size:12px;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:6px;margin-top:10px}.mini{flex:1;padding:7px 4px;border:1px solid #ffffff20;background:#29213d;color:white;border-radius:8px}
.empty{grid-column:1/-1;text-align:center;padding:35px;background:var(--panel);border-radius:14px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;z-index:10;background:#000c;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}
.dialog{position:relative;width:min(620px,100%);max-height:90vh;overflow:auto;background:#19172a;border:1px solid #ffffff25;border-radius:18px;padding:22px}
.close{position:absolute;right:12px;top:10px;border:0;border-radius:50%;background:#302a43;color:white;width:34px;height:34px;font-size:20px}
.detail{display:grid;grid-template-columns:150px 1fr;gap:16px}.detail .poster-fallback{border-radius:10px}
.video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000;margin-top:12px}
.admin{display:none;margin:28px 0;padding:20px;background:#19172a;border:1px solid #7542a4;border-radius:16px}.admin.open{display:block}
.admin>*{margin:7px 0}.muted{color:var(--muted)}footer{text-align:center;color:var(--muted);border-top:1px solid #ffffff18;margin-top:35px}
@media(max-width:950px){.catalog{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:650px){.catalog{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.controls{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}nav{width:100%}nav .btn{flex:1;padding:9px 6px;font-size:12px}.hero{padding:23px}.detail{grid-template-columns:105px 1fr}}
</style>
</head>
<body>
<header><div class="head">
<div class="logo">KinoMezafilms</div>
<nav>
<button class="btn" type="button" onclick="showCatalog()">Каталог</button>
<button class="btn" type="button" onclick="showFavorites()">Избранное</button>
<button class="btn" type="button" onclick="showLater()">Посмотреть позже</button>
<button class="btn" type="button" onclick="openLogin()">Админ</button>
</nav></div></header>
<main>
<section class="hero">
<h1>Твой мир кино</h1>
<p>Выбирай фильмы, открывай новые истории и собирай собственную коллекцию.</p>
<button class="btn primary" type="button" onclick="showCatalog()">Открыть каталог</button>
<button class="btn" type="button" onclick="randomMovie()">Случайный фильм</button>
</section>
<h2 id="heading">Каталог фильмов <small id="count" class="muted"></small></h2>
<div class="controls">
<input id="search" class="field" placeholder="Поиск фильма..." oninput="render()">
<select id="sort" class="field" onchange="render()"><option value="rating">Сначала популярные</option><option value="new">Сначала новые</option><option value="old">Сначала старые</option><option value="name">По названию</option></select>
</div>
<div id="filters" class="filters"></div>
<div id="catalog" class="catalog"></div>
<section id="admin" class="admin">
<h2>Панель администратора</h2>
<button class="btn" type="button" onclick="logout()">Выйти</button>
<p class="muted">Добавление ссылок на видео к выбранному фильму.</p>
<select id="adminMovie" class="field"></select>
<input id="videoUrl" class="field" placeholder="Ссылка на видео (YouTube, Vimeo или MP4)">
<input id="trailerUrl" class="field" placeholder="Ссылка на трейлер (необязательно)">
<button class="btn primary" type="button" onclick="saveLinks()">Сохранить ссылки</button>
<p id="adminMsg" class="muted">Админ-панель.</p>
</section>
</main>
<footer>KinoMezafilms © 2026</footer>

<div id="loginModal" class="modal" onclick="outside(event,'loginModal')"><div class="dialog">
<button class="close" type="button" onclick="closeModal('loginModal')">×</button>
<h2>Вход администратора</h2>
<input id="email" class="field" type="email" placeholder="Email">
<input id="password" class="field" type="password" placeholder="Пароль">
<button class="btn primary" type="button" onclick="login()">Войти</button>
<p id="loginMsg" class="muted">Вход через Supabase.</p>
</div></div>
<div id="movieModal" class="modal" onclick="outside(event,'movieModal')"><div class="dialog">
<button class="close" type="button" onclick="closeModal('movieModal')">×</button><div id="details"></div>
</div></div>

let genre="Все",mode="all",db=null,isAdmin=false,user=null,links={};
const genres=["Все",...new Set(movies.map(m=>m.genre))];
function getSet(key){try{return new Set(JSON.parse(localStorage.getItem(key)||"[]"))}catch(e){return new Set()}}
const fav=getSet("km_fav"),later=getSet("km_later");
function persist(){localStorage.setItem("km_fav",JSON.stringify([...fav]));localStorage.setItem("km_later",JSON.stringify([...later]))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function movie(id){return movies.find(m=>m.id===id)}
function renderFilters(){document.getElementById("filters").innerHTML=genres.map(g=>`<button type="button" class="filter ${genre===g?"active":""}" onclick="setGenre(${JSON.stringify(g)})">${esc(g)}</button>`).join("")}
function setGenre(g){genre=g;mode="all";renderFilters();render()}
function showCatalog(){mode="all";genre="Все";document.getElementById("heading").textContent="Каталог фильмов";renderFilters();render()}
function showFavorites(){mode="fav";document.getElementById("heading").textContent="Избранное";render()}
function showLater(){mode="later";document.getElementById("heading").textContent="Посмотреть позже";render()}
function toggle(id,type){const s=type==="fav"?fav:later;s.has(id)?s.delete(id):s.add(id);persist();render();if(document.getElementById("movieModal").classList.contains("open"))openMovie(id)}
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase(),sort=document.getElementById("sort").value;
 let list=movies.filter(m=>(!q||m.title.toLowerCase().includes(q))&&(genre==="Все"||m.genre===genre)&&(mode==="fav"?fav.has(m.id):mode==="later"?later.has(m.id):true));
 list.sort(sort==="new"?(a,b)=>b.year-a.year:sort==="old"?(a,b)=>a.year-b.year:sort==="name"?(a,b)=>a.title.localeCompare(b.title,"ru"):(a,b)=>b.rating-a.rating);
 document.getElementById("count").textContent="("+list.length+")";
 const root=document.getElementById("catalog");
 if(!list.length){root.innerHTML='<div class="empty">Ничего не найдено.</div>';return}
 root.innerHTML=list.map(m=>`<article class="movie" onclick="openMovie('${m.id}')"><div class="poster-fallback">${esc(m.title)}</div><img class="poster" alt="${esc(m.title)}" hidden><div class="info"><div class="name">${esc(m.title)}</div><div class="meta">${m.year} · ${esc(m.genre)} · ★ ${m.rating}</div><div class="actions"><button class="mini" type="button" onclick="event.stopPropagation();toggle('${m.id}','fav')">${fav.has(m.id)?"♥":"♡"}</button><button class="mini" type="button" onclick="event.stopPropagation();toggle('${m.id}','later')">${later.has(m.id)?"✓":"＋"}</button></div></div></article>`).join("");
 root.querySelectorAll(".movie").forEach((card,i)=>loadPoster(list[i],card));
}
async function loadPoster(m,card){
 try{const u="https://en.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&piprop=thumbnail&pithumbsize=400&titles="+encodeURIComponent(m.wiki)+"&origin=*";const r=await fetch(u);if(!r.ok)return;const j=await r.json();const p=Object.values(j.query.pages)[0];if(p.thumbnail?.source){const img=card.querySelector("img");img.src=p.thumbnail.source;img.hidden=false;card.querySelector(".poster-fallback").remove()}}catch(e){/* poster unavailable: keep title placeholder */}
}
function randomMovie(){openMovie(movies[Math.floor(Math.random()*movies.length)].id)}
function openMovie(id){
 const m=movie(id);if(!m)return;const l=links[id]||{};
 document.getElementById("details").innerHTML=`<h2>${esc(m.title)}</h2><div class="detail"><div class="poster-fallback">${esc(m.title)}</div><div><p class="muted">${m.year} · ${esc(m.genre)} · ★ ${m.rating}</p><p>${esc(m.desc)}</p><button class="btn" type="button" onclick="toggle('${id}','fav')">${fav.has(id)?"Убрать из избранного":"В избранное"}</button> <button class="btn" type="button" onclick="toggle('${id}','later')">${later.has(id)?"Убрать из списка":"Посмотреть позже"}</button></div></div><div id="player"></div>${l.trailer_url?`<button class="btn" type="button" onclick="play('${id}','trailer')">Трейлер</button>`:""} ${l.video_url?`<button class="btn primary" type="button" onclick="play('${id}','movie')">Смотреть</button>`:""}${!l.video_url&&!l.trailer_url?'<p class="muted">Видео пока не добавлено.</p>':""}`;
 document.getElementById("movieModal").classList.add("open");
}
function safeUrl(s){try{const u=new URL(s);return u.protocol==="https:"?u:null}catch(e){return null}}
function play(id,type){
 const l=links[id]||{},raw=type==="trailer"?l.trailer_url:l.video_url,u=safeUrl(raw||"");if(!u){alert("Ссылка некорректна.");return}
 const host=u.hostname.replace(/^www\./,"");let src=null;
 if(host==="youtu.be")src="https://www.youtube-nocookie.com/embed/"+u.pathname.slice(1);
 if(host==="youtube.com"||host==="m.youtube.com"){const v=u.searchParams.get("v");if(v)src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(v);else if(u.pathname.startsWith("/embed/"))src=u.href}
 if(host==="vimeo.com"){const v=u.pathname.split("/").filter(Boolean).pop();if(/^\d+$/.test(v||""))src="https://player.vimeo.com/video/"+v}
 const area=document.getElementById("player");
 if(/\.(mp4|webm|ogg)$/i.test(u.pathname))area.innerHTML=`<video class="video" controls playsinline src="${esc(u.href)}"></video>`;
 else if(src)area.innerHTML=`<iframe class="video" src="${esc(src)}" allowfullscreen loading="lazy"></iframe>`;
 else area.innerHTML=`<p><a target="_blank" rel="noopener" href="${esc(u.href)}">Открыть видео в новой вкладке</a></p>`;
}
function closeModal(id){document.getElementById(id).classList.remove("open")}
function outside(e,id){if(e.target.id===id)closeModal(id)}
function openLogin(){document.getElementById("loginModal").classList.add("open")}
async function initSupabase(){
 if(!window.supabase){document.getElementById("loginMsg").textContent="Не удалось загрузить Supabase SDK.";return}
 try{
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data,error}=await db.from("movie_streams").select("movie_id,video_url,trailer_url");
  if(!error)(data||[]).forEach(r=>links[r.movie_id]=r);
  const session=await db.auth.getSession();
  if(session.data?.session)await checkAdmin();
  db.auth.onAuthStateChange((_event,s)=>{if(!s){isAdmin=false;user=null;document.getElementById("admin").classList.remove("open")}else setTimeout(checkAdmin,0)});
 }catch(e){console.error(e)}
}
async function checkAdmin(){
 try{const res=await db.auth.getUser();user=res.data?.user||null;if(!user)return;const a=await db.rpc("is_site_admin");isAdmin=!a.error&&a.data===true;if(isAdmin){document.getElementById("admin").classList.add("open");document.getElementById("adminMovie").innerHTML=movies.map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join("")}}catch(e){isAdmin=false;console.error(e)}
}
async function login(){
 const msg=document.getElementById("loginMsg");if(!db){msg.textContent="Supabase не загрузился.";return}
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||!password){msg.textContent="Заполни email и пароль.";return}
 msg.textContent="Выполняется вход...";
 const r=await db.auth.signInWithPassword({email,password});
 if(r.error){msg.textContent="Ошибка входа: "+r.error.message;return}
 await checkAdmin();if(isAdmin){closeModal("loginModal");msg.textContent="Вход выполнен."}else{await db.auth.signOut();msg.textContent="У этого аккаунта нет прав администратора."}
}
async function logout(){if(db)await db.auth.signOut();isAdmin=false;user=null;document.getElementById("admin").classList.remove("open")}
async function saveLinks(){
 const msg=document.getElementById("adminMsg");if(!db||!isAdmin){msg.textContent="Нет прав администратора.";return}
 const id=document.getElementById("adminMovie").value,video=document.getElementById("videoUrl").value.trim(),trailer=document.getElementById("trailerUrl").value.trim();
 if(!video&&!trailer){msg.textContent="Добавь хотя бы одну ссылку.";return}
 if((video&&!safeUrl(video))||(trailer&&!safeUrl(trailer))){msg.textContent="Используй ссылки HTTPS.";return}
 msg.textContent="Сохраняем...";
 const r=await db.from("movie_streams").upsert({movie_id:id,video_url:video||trailer,trailer_url:trailer||null,updated_at:new Date().toISOString(),updated_by:user.id},{onConflict:"movie_id"});
 if(r.error){msg.textContent="Ошибка Supabase: "+r.error.message;return}
 links[id]={video_url:video||trailer,trailer_url:trailer||null};msg.textContent="Ссылки сохранены.";document.getElementById("videoUrl").value="";document.getElementById("trailerUrl").value="";
}
renderFilters();render();initSupabase();
</script>
</body>
