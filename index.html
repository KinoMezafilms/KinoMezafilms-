<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090914">
<title>KinoMezafilms — твой мир кино</title>
<style>
:root{--bg:#090914;--panel:#151526;--panel2:#202039;--text:#f5f5ff;--muted:#aaaac0;--purple:#a855f7;--pink:#ec4899}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#38205c,var(--bg) 42%);color:var(--text);font-family:Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#090914ed;backdrop-filter:blur(15px);border-bottom:1px solid #ffffff18;padding:14px 5%}
.nav{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-size:23px;font-weight:900;letter-spacing:-1px}.logo span{color:var(--pink)}
nav{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid #ffffff20;background:var(--panel2);color:white;border-radius:11px;padding:10px 14px;transition:.2s}
.btn:hover{border-color:var(--purple);transform:translateY(-1px)}
.primary{background:linear-gradient(110deg,var(--purple),var(--pink));border:0;font-weight:bold}
main{max-width:1250px;margin:auto;padding:24px 5% 55px}
.hero{min-height:290px;padding:32px;border:1px solid #a855f744;border-radius:24px;background:linear-gradient(90deg,#0c0b19 5%,#17102add 60%,#24103a99),radial-gradient(circle at 80% 30%,#a855f766,transparent 50%);display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:clamp(34px,6vw,58px);margin:0 0 10px}.hero h1 span{color:#d879ff}
.hero p{color:var(--muted);max-width:560px;line-height:1.6}
.search{display:flex;gap:10px;max-width:650px;margin-top:14px}
.search input,.profile-input{min-width:0;flex:1;padding:14px;border:1px solid #ffffff20;border-radius:11px;background:#111120;color:white;outline:none}
.search input:focus,.profile-input:focus{border-color:var(--purple)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 14px}
.section-head h2{font-size:23px;margin:0}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.feature{min-height:125px;padding:17px;border-radius:16px;border:1px solid #ffffff18;background:linear-gradient(145deg,#25153c,#151526);text-align:left;color:white}
.feature strong{display:block;font-size:17px;margin:9px 0 5px}
.feature span{font-size:13px;color:var(--muted);line-height:1.4}
.feature .emoji{font-size:25px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:5px 0 12px}
.filter{white-space:nowrap;border:1px solid #ffffff20;background:var(--panel);color:var(--muted);padding:9px 14px;border-radius:30px}
.filter.active{color:white;background:linear-gradient(110deg,#8538c9,#bd368b);border-color:transparent}
.movies{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px}
.movie{overflow:hidden;background:var(--panel);border:1px solid #ffffff18;border-radius:15px;cursor:pointer;transition:.2s}
.movie:hover{transform:translateY(-4px);border-color:#a855f7aa;box-shadow:0 12px 30px #0008}
.poster{height:245px;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;overflow:hidden;background:linear-gradient(145deg,#38205c,#111122 65%,#631e55)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster-title{position:relative;z-index:1;font-size:20px;font-weight:900;text-shadow:0 3px 15px #000}
.movie-info{padding:12px}.movie-info h3{font-size:15px;margin:0 0 7px}
.meta{font-size:12px;color:var(--muted)}
.movie-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.rating{color:#ffd166;font-weight:bold;font-size:13px}
.heart{border:0;background:transparent;color:#aaa;font-size:22px}.heart.active{color:#ff4f91}
.watch{border:0;background:transparent;color:#b9a1ff;font-size:12px;padding:4px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px;background:var(--panel);border-radius:15px}
.
  modal{position:fixed;inset:0;z-index:30;background:#000d;display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#151526;border:1px solid #a855f755;border-radius:20px;padding:22px;box-shadow:0 20px 70px #000}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-top h2{margin:0}
.close{border:0;color:white;background:#ffffff18;border-radius:9px;padding:9px 13px}
.modal-box p{color:var(--muted);line-height:1.65}
.modal-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
footer{text-align:center;padding:28px 15px;color:var(--muted);border-top:1px solid #ffffff18}
@media(max-width:900px){.movies{grid-template-columns:repeat(3,minmax(0,1fr))}.feature-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){header{padding:12px 4%}.nav{align-items:flex-start;flex-direction:column}main{padding:17px 4% 40px}.hero{padding:23px 17px;min-height:255px}.movies{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.poster{height:205px}.movie-info{padding:10px}.movie-info h3{font-size:14px}.search{flex-direction:column}.search button{width:100%}.feature-grid{gap:8px}.feature{padding:13px;min-height:120px}.section-head h2{font-size:20px}}
</style>
</head>

  <button class="filter" onclick="setGenre('Триллер',this)">Триллер</button>
  <button class="filter" onclick="setGenre('Комедия',this)">Комедия</button>

  <button class="filter" onclick="setGenre('Приключения',this)">Приключения</button>
 </div>
 <section class="movies" id="movies"></section>
</main>

<footer>
 <div class="logo">Kino<span>Meza</span>films</div>
 <p>Твоя территория кино © 2026</p>
 <p>Каталог для ознакомления. Права на фильмы принадлежат их владельцам.</p>
</footer>

<div class="modal" id="modal" onclick="outsideClose(event)">
  <div class="modal-box">
  <div class="modal-top"><h2 id="modalTitle">Фильм</h2><button class="close" onclick="closeModal()">✕</button></div>
  <div id="modalContent"></div>

</div>

const movies=raw.trim().split("\n").map((line,i)=>{
 const [title,year,genre,rating,wiki,description,mood]=line.split("~");
 return {id:i+1,title,year,genre,rating,wiki,description,mood};
});

let genre="Все",mood=null,mode="all";
let favorites=readStore("kmf_favorites",[]);
let watchlist=readStore("kmf_watchlist",[]);
let posterCache=readStore("kmf_posters",{});

function readStore(key,fallback){
 try{return JSON.parse(localStorage.getItem(key))??fallback}catch(e){return fallback}
}
function saveStore(key,value){localStorage.setItem(key,JSON.stringify(value))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function renderMovies(){
 const q=document.getElementById("searchInput").value.toLowerCase().trim();
 let list=movies.filter(m=>{
  return (genre==="Все"||m.genre===genre)&&(!mood||m.mood===mood)&&
  (!q||m.title.toLowerCase().includes(q))&&
  (mode==="favorites"?favorites.includes(m.id):mode==="watch"?watchlist.includes(m.id):true);
 });
 document.getElementById("movieCount").textContent=list.length+" фильмов";
 const box=document.getElementById("movies");
 if(!list.length){box.innerHTML='<div class="empty">Ничего не найдено. Попробуй другой запрос.</div>';return}
 box.innerHTML=list.map(m=>`
 <article class="movie" onclick="openMovie(${m.id})">
  <div class="poster" id="poster-${m.id}">
   <div class="poster-title">${esc(m.title)}</div>
  </div>
  <div class="movie-info">
   <h3>${esc(m.title)}</h3>
   <div class="meta">${m.year} · ${esc(m.genre)}</div>
   <div class="movie-bottom">
    <span class="rating">★ ${m.rating}</span>
    <button class="heart ${favorites.includes(m.id)?"active":""}" onclick="toggleFavorite(event,${m.id})" aria-label="Избранное">♥️</button>
   </div>
   <button class="watch" onclick="toggleWatch(event,${m.id})">${watchlist.includes(m.id)?"✓ В списке":"＋ Посмотреть позже"}</button>
  </div>
 </article>`).join("");
 list.forEach(loadPoster);
}

async function loadPoster(m){
 const holder=document.getElementById("poster-"+m.id);
 if(!holder)return;
 if(posterCache[m.id]){putPoster(holder,posterCache[m.id],m.title);return}
 if(holder.dataset.loading)return;
 holder.dataset.loading="1";
 try{
  const url="https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(m.wiki);
  const response=await fetch(url);
  if(!response.ok)throw new Error("No image");
  const data=await response.json();
  const image=data.thumbnail?.source||data.originalimage?.source;
  if(image){
   posterCache[m.id]=image;
   saveStore("kmf_posters",posterCache);
   if(document.
      getElementById("poster-"+m.id))putPoster(document.getElementById("poster-"+m.id),image,m.title);
  }
 }catch(e){/* Оставляем красивую текстовую заглушку */}
}
function putPoster(holder,url,title){
 holder.innerHTML=`<img loading="lazy" src="${esc(url)}" alt="${esc(title)}" onerror="this.remove()"><div class="poster-title">${esc(title)}</div>`;
}

function setGenre(value,button){
 genre=value;mood=null;mode="all";
 document.getElementById("catalogTitle").textContent="Каталог фильмов";
 document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 renderMovies();
}
function resetFilters(){
 genre="Все";mood=null;mode="all";
 document.getElementById("searchInput").value="";
 document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
 document.querySelector(".filter").classList.add("active");
}
function showAll(){resetFilters();document.getElementById("catalogTitle").textContent="Каталог фильмов";renderMovies()}
function showFavorites(){resetFilters();mode="favorites";document.getElementById("catalogTitle").textContent="♥️ Избранное";renderMovies()}
function showWatchlist(){resetFilters();mode="watch";document.getElementById("catalogTitle").textContent="Посмотреть позже";renderMovies()}
function showMood(value){
 resetFilters();mood=value;
 document.getElementById("catalogTitle").textContent=value==="Напрячься"?"Фильмы с интригой":"Фильмы для хорошего настроения";
 renderMovies();
}
function toggleFavorite(e,id){
 e.stopPropagation();
 favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];
 saveStore("kmf_favorites",favorites);renderMovies();
}
function toggleWatch(e,id){
 e.stopPropagation();
 watchlist=watchlist.includes(id)?watchlist.filter(x=>x!==id):[...watchlist,id];
 saveStore("kmf_watchlist",watchlist);renderMovies();
}
function openMovie(id){
 const m=movies.find(x=>x.id===id);if(!m)return;
 document.getElementById("modalTitle").textContent=m.title;
 document.getElementById("modalContent").innerHTML=`
 <div class="meta">${m.year} · ${esc(m.genre)} · ${esc(m.mood)}</div>
 <h3 class="rating">★ ${m.rating}</h3>
 <p>${esc(m.description)}</p>
 <div class="modal-actions">
  <button class="btn primary" onclick="searchTrailer(${m.id})">▶️ Найти трейлер</button>
  <button class="btn" onclick="modalFavorite(${m.id})">${favorites.includes(id)?"♥️ Убрать из избранного":"♡ В избранное"}</button>
  <button class="btn" onclick="modalWatch(${m.id})">${watchlist.includes(id)?"✓ Убрать из списка":"＋ Посмотреть позже"}</button>
 </div>
 <p class="meta">Изображение загружается из открытых источников, если доступно.</p>`;
 document.getElementById("modal").classList.add("show");
}
function modalFavorite(id){
 favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];
 saveStore("kmf_favorites",favorites);openMovie(id);renderMovies();
}
function modalWatch(id){
 watchlist=watchlist.includes(id)?watchlist.filter(x=>x!==id):[...watchlist,id];
 saveStore("kmf_watchlist",watchlist);openMovie(id);renderMovies();
}
function searchTrailer(id){
 const m=movies.find(x=>x.id===id);
 window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(m.title+" трейлер"),"_blank");
}
function randomMovie(){
 const list=movies.filter(m=>(genre==="Все"||m.genre===genre)&&(!mood||m.mood===mood));
 if(list.length)openMovie(list[Math.floor(Math.random()*list.length)].id);
}
function filmOfDay(){
 const day=Math.floor(Date.now()/86400000);
 openMovie(movies[day%movies.length].id);
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function outsideClose(e){if(e.target.id==="modal")closeModal()}
function openProfile(){
 const name=localStorage.getItem("kmf_username")||"";
 document.getElementById("modalTitle").textContent="Мой профиль";
 document.getElementById("modalContent").innerHTML=`
 <p>Добро пожаловать в KinoMezafilms!</p>
 <input class="profile-input" id="profileName" placeholder="Твоё имя" value="${esc(name)}">
 <button class="btn primary" onclick="saveProfile()">Сохранить профиль</button>
 <p id="profileMessage"></p>
 <div class="profile-card">
 <p>♥️ Избранное: ${favorites.length} фильмов</p>
 <p>Посмотреть позже: ${watchlist.length} фильмов</p>
 <p class="meta">Данные профиля сохраняются только в этом браузере.</p>
 </div>`;
 document.getElementById("modal").classList.add("show");
}
function saveProfile(){
 const name=document.getElementById("profileName").value.trim();
 if(!name){document.getElementById("profileMessage").textContent="Введи имя.";return}
 localStorage.setItem("kmf_username",name);
 document.getElementById("profileMessage").textContent="Профиль сохранён!";
}
renderMovies();
</script>
