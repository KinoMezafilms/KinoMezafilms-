<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090914">
<title>KinoMezafilms — мир кино</title>
<style>
:root{--bg:#090914;--panel:#171729;--panel2:#24243c;--text:#f5f5ff;--muted:#aaaac0;--accent:#a855f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:#090914ed;border-bottom:1px solid #ffffff18;padding:15px}
.header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:bold;color:#c084fc}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid #ffffff20;border-radius:10px;padding:10px 14px;background:var(--panel2);color:white}
button:hover{border-color:#c084fc}
.primary{background:linear-gradient(100deg,#9333ea,#db2777);border:0}
main{max-width:1200px;margin:auto;padding:20px 14px}
.hero{padding:35px 25px;border-radius:20px;background:linear-gradient(120deg,#281342,#48204f);margin-bottom:28px}
.hero h1{font-size:clamp(30px,6vw,48px);margin:0 0 12px}
.hero p{color:#e0d2f3;line-height:1.5}
.controls{display:grid;grid-template-columns:1fr 190px;gap:10px;margin:20px 0}
input,select{background:var(--panel);border:1px solid #ffffff20;color:white;padding:13px;border-radius:10px;width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter.active{background:#7627a8;border-color:#c084fc}
.catalog{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.movie{background:var(--panel);border:1px solid #ffffff15;border-radius:14px;overflow:hidden;cursor:pointer;min-width:0;transition:transform .2s,border-color .2s}
.movie:hover{transform:translateY(-3px);border-color:#a855f7}
.poster{width:100%;aspect-ratio:2/3;position:relative;background:linear-gradient(145deg,#38204e,#151525);overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;opacity:0;transition:opacity .25s}
.poster img.loaded{opacity:1}
.poster-fallback{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:#e9caff;font-size:18px;font-weight:bold}
.info{padding:11px}
.title{font-weight:bold;line-height:1.35}
.meta{color:var(--muted);font-size:12px;margin-top:7px}
.actions{display:flex;gap:6px;margin-top:10px}
.actions button{flex:1;padding:8px 4px;font-size:12px}
.empty{grid-column:1/-1;text-align:center;padding:35px;background:var(--panel);border-radius:12px;color:var(--muted)}
.section{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:30;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modal-box{background:var(--panel);border:1px solid #ffffff25;border-radius:18px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto;position:relative}
.close{position:absolute;right:12px;top:12px;z-index:2}
.detail{display:grid;grid-template-columns:150px 1fr;gap:16px;margin-top:20px}
.detail img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px}
.muted{color:var(--muted);line-height:1.5}
.video-section{margin-top:24px;padding-top:18px;border-top:1px solid #ffffff18}
.video-section h3{margin:0 0 12px}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#050509;border:1px solid #ffffff20;border-radius:14px;overflow:hidden}
.video-frame iframe,.video-frame video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.video-placeholder{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;color:var(--muted);background:linear-gradient(145deg,#21152f,#0d0d18);border:1px dashed #8b5cf6;border-radius:14px}
.video-placeholder strong{font-size:18px;color:#e9d5ff;margin-bottom:8px}
.video-note{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5}
footer{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:900px){.catalog{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){
 .catalog{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .controls{grid-template-columns:1fr}
 .header{justify-content:center}
 .detail{grid-template-columns:105px 1fr}
 .hero{padding:25px 18px}
 .modal-box{padding:16px}
}
.admin-button{background:#3b1760;border-color:#a855f7}
.admin-panel{display:none;background:#171729;border:1px solid #a855f755;border-radius:16px;padding:16px;margin:18px 0}
.admin-panel.show{display:block}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.admin-grid textarea{min-height:100px;resize:vertical}
.admin-grid .wide{grid-column:1/-1}
.admin-status{color:#c084fc;margin:10px 0}
@media(max-width:600px){.admin-grid{grid-template-columns:1fr}.admin-grid .wide{grid-column:auto}}
</style>
</head>
<body>
<header>
<div class="header">
 <div class="logo">KinoMezafilms</div>
 <div>
  <button onclick="showCatalog()">Каталог</button>
  <button onclick="showFavorites()">♥ Избранное</button>
  <button onclick="showLater()">Посмотреть позже</button>
  <button class="admin-button" onclick="openAdmin()">⚙ Админ</button>
 </div>
</div>
</header>
<main>
<section class="hero">
 <h1>Твой мир кино</h1>
 <p>Выбирай фильмы, открывай новые истории и собирай собственную коллекцию.</p>
 <button class="primary" onclick="showCatalog()">Открыть каталог</button>
 <button onclick="randomMovie()">Случайный фильм</button>
</section>
<div class="section">
 <h2 id="heading">Каталог фильмов</h2>
 <span id="count" class="muted"></span>
</div>
<section id="adminPanel" class="admin-panel">
 <h2>Админ-панель KinoMezafilms</h2>
 <div id="adminAuth">
  <p>Вход администратора Supabase</p>
  <div class="admin-grid">
   <input id="adminEmail" type="email" placeholder="Email администратора">
   <input id="adminPassword" type="password" placeholder="Пароль">
   <button class="primary wide" onclick="adminLogin()">Войти</button>
  </div>
 </div>
 <div id="adminTools" style="display:none">
  <div class="section"><strong>Добавить / изменить фильм</strong><button onclick="adminLogout()">Выйти</button></div>
  <div class="admin-grid" style="margin-top:12px">
   <input id="fId" placeholder="ID (например inception)">
   <input id="fTitle" placeholder="Название фильма">
   <input id="fYear" type="number" placeholder="Год">
   <input id="fGenre" placeholder="Жанр">
   <input id="fRating" type="number" step="0.1" placeholder="Рейтинг">
   <input id="fWiki" placeholder="Wikipedia title (для постера)">
   <textarea id="fDescription" class="wide" placeholder="Описание"></textarea>
   <input id="fVideo" class="wide" placeholder="Ссылка на фильм (разрешённый источник HTTPS)">
   <input id="fTrailer" class="wide" placeholder="Ссылка на трейлер (HTTPS)">
   <label class="wide">Постер: <input id="fPoster" type="file" accept="image/jpeg,image/png,image/webp"></label>
   <label><input id="fNew" type="checkbox" style="width:auto"> Новинка</label>
   <label><input id="fPopular" type="checkbox" style="width:auto"> Популярный</label>
   <button class="primary" onclick="adminSaveMovie()">Сохранить фильм</button>
   <button onclick="adminClearForm()">Очистить форму</button>
  </div>
  <p id="adminStatus" class="admin-status"></p>
  <h3>Фильмы в базе</h3>
  <button onclick="importLocalCatalog()">Загрузить текущий каталог в базу</button>
  <div id="adminMovieList"></div>
 </div>
</section>
<div class="controls">
 <input id="search" placeholder="Найти фильм..." oninput="render()">
 <select id="sort" onchange="render()">
  <option value="rating">Сначала популярные</option>
  <option value="new">Сначала новые</option>
  <option value="old">Сначала старые</option>
  <option value="name">По названию</option>
 </select>
</div>
<div class="filters" id="filters"></div>
<div class="catalog" id="catalog"></div>
</main>
<footer>KinoMezafilms © 2026</footer>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
 <div class="modal-box">
  <button class="close" onclick="closeModal()">✕</button>
  <div id="details"></div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
